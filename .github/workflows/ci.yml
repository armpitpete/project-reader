name: Validate Project Reader

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -q -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Rebuild static proofs
        run: |
          python scripts/render_sample.py
          python scripts/render_project_status_engine.py
          git diff --exit-code -- prototype

  live-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -q -e .
      - name: Collect automatic public evidence
        run: |
          python scripts/collect_public_evidence.py \
            https://github.com/armpitpete/project-status-engine \
            --output /tmp/project-status-engine-evidence.json
      - name: Validate automatic public evidence
        run: |
          python - <<'PY'
          from datetime import datetime
          import json
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/project-status-engine-evidence.json").read_text(encoding="utf-8")
          )
          assert payload["schema_version"] == 1
          assert payload["repository"] == "armpitpete/project-status-engine"
          assert len(payload["source_commit"]) == 40
          assert payload["source_url"].endswith(payload["source_commit"])
          assert datetime.fromisoformat(payload["checked_at"].replace("Z", "+00:00"))

          files = {item["path"]: item for item in payload["important_files"]}
          progress_file = files[".project/progress.json"]
          assert progress_file["collection_method"] == "exact_public_file"
          assert progress_file["source_commit"] == payload["source_commit"]
          assert progress_file["source_url"].endswith(
              f'{payload["source_commit"]}/.project/progress.json'
          )
          assert all(
              item["collection_method"] in {"gitingest", "exact_public_file"}
              and item["source_commit"] == payload["source_commit"]
              and item["source_url"].startswith("https://")
              for item in payload["important_files"]
          )
          assert any(
              record["path"] == ".project/progress.json"
              and record["authority_rank"] == 1
              and record["valid_json"] is True
              for record in payload["progress_records"]
          )
          assert isinstance(payload["open_issues"], list)
          assert isinstance(payload["open_pull_requests"], list)
          PY
