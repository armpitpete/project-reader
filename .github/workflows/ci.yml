name: Validate Project Reader

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -q -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Rebuild static proofs
        run: |
          python scripts/render_sample.py
          python scripts/render_project_status_engine.py
          git diff --exit-code -- prototype

  live-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_READER_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -q -e .
      - name: Collect automatic public evidence
        run: |
          python scripts/collect_public_evidence.py \
            https://github.com/armpitpete/project-status-engine \
            --output /tmp/project-status-engine-evidence.json
      - name: Validate automatic public evidence
        run: |
          python - <<'PY'
          from datetime import datetime
          import json
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/project-status-engine-evidence.json").read_text(encoding="utf-8")
          )
          assert payload["schema_version"] == 1
          assert payload["repository"] == "armpitpete/project-status-engine"
          assert len(payload["source_commit"]) == 40
          assert payload["source_url"].endswith(payload["source_commit"])
          assert datetime.fromisoformat(payload["checked_at"].replace("Z", "+00:00"))

          files = {item["path"]: item for item in payload["important_files"]}
          progress_file = files[".project/progress.json"]
          assert progress_file["collection_method"] == "exact_public_file"
          assert progress_file["source_commit"] == payload["source_commit"]
          assert progress_file["source_url"].endswith(
              f'{payload["source_commit"]}/.project/progress.json'
          )
          assert all(
              item["collection_method"] in {"gitingest", "exact_public_file"}
              and item["source_commit"] == payload["source_commit"]
              and item["source_url"].startswith("https://")
              for item in payload["important_files"]
          )
          assert any(
              record["path"] == ".project/progress.json"
              and record["authority_rank"] == 1
              and record["valid_json"] is True
              for record in payload["progress_records"]
          )
          languages = {item["name"]: item for item in payload["repository_languages"]}
          assert set(languages) >= {
              "Python",
              "SourcePawn",
              "C++",
              "Pawn",
              "Shell",
              "PowerShell",
          }
          assert languages["Python"]["percentage"] == 74.7
          assert languages["SourcePawn"]["percentage"] == 11.6
          assert all(
              item["source_url"]
              == "https://api.github.com/repos/armpitpete/project-status-engine/languages"
              and item["source_commit"] == payload["source_commit"]
              for item in payload["repository_languages"]
          )
          assert isinstance(payload["open_issues"], list)
          assert isinstance(payload["open_pull_requests"], list)
          PY
      - name: Interpret automatic public evidence
        run: |
          python scripts/interpret_evidence.py \
            /tmp/project-status-engine-evidence.json \
            --output /tmp/project-status-engine-interpretation.json
      - name: Validate automatic interpretation contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(
              Path("/tmp/project-status-engine-evidence.json").read_text(
                  encoding="utf-8"
              )
          )
          payload = json.loads(
              Path("/tmp/project-status-engine-interpretation.json").read_text(
                  encoding="utf-8"
              )
          )
          assert payload["schema_version"] == 1
          assert payload["source_evidence_schema_version"] == 1
          assert payload["repository"] == "armpitpete/project-status-engine"
          assert len(payload["source_commit"]) == 40
          assert payload["purpose"]["kind"] == "fact"
          assert (
              "Automatic activity and authority-backed completion reporting"
              in payload["purpose"]["text"]
          )

          authority = payload["owner_authority_records"]
          assert authority[0]["path"] == ".project/progress.json"
          assert authority[0]["authority_rank"] == 1
          assert authority[0]["primary"] is True

          assert len(payload["done"]) == 4
          assert all(item["kind"] == "fact" for item in payload["done"])
          assert payload["remaining"][0]["key"] == "remaining:none-listed"
          assert payload["conflicts"] == []
          languages = {item["language_name"]: item for item in payload["repository_languages"]}
          assert set(languages) >= {
              "Python",
              "SourcePawn",
              "C++",
              "Pawn",
              "Shell",
              "PowerShell",
          }
          assert languages["Python"]["language_percentage"] == 74.7
          assert languages["C++"]["key"] == "language:c-plus-plus"

          evidence_by_key = {item["key"]: item for item in payload["evidence"]}
          candidate_sections = [
              [payload["purpose"]],
              payload["done"],
              payload["remaining"],
              payload["repository_languages"],
              payload["technologies"],
              payload["uncertainties"],
          ]
          assert all(
              set(candidate["evidence_keys"]) <= set(evidence_by_key)
              for section in candidate_sections
              for candidate in section
          )

          queue_count = len(evidence["open_issues"]) + len(
              evidence["open_pull_requests"]
          )
          queue_candidate = next(
              (
                  item
                  for item in payload["uncertainties"]
                  if item["key"] == "uncertainty:open-queues"
              ),
              None,
          )
          if queue_count:
              assert queue_candidate is not None
              assert len(queue_candidate["evidence_keys"]) == queue_count
              assert all(
                  evidence_by_key[key]["role"]
                  in {"open_issue", "open_pull_request"}
                  for key in queue_candidate["evidence_keys"]
              )
          else:
              assert queue_candidate is None

          assert {item["topic"] for item in payload["refusals"]} == {
              "completion_percentage",
              "likelihood_assessment",
              "final_status",
          }
          assert not any(
              key in payload
              for key in ("completion_percentage", "likelihood", "status")
          )
          PY
      - name: Render complete project reading
        run: |
          python scripts/render_evidence_reading.py \
            /tmp/project-status-engine-evidence.json \
            --output /tmp/project-status-engine-reader.html
      - name: Validate complete project reading
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path("/tmp/project-status-engine-reader.html").read_text(
              encoding="utf-8"
          )
          primary = html.split('<section class="disclosures"', 1)[0]
          assert "Project Status Engine" in html
          assert "What is this project?" in primary
          assert "What has been finished?" in primary
          assert "What is still to do?" in primary
          assert "Will the current plan be finished?" in primary
          assert "What happens next?" in primary
          assert "How complete?" not in primary
          assert "Likely to finish?" not in primary
          assert "Source commit:" not in primary
          assert "Repository languages" not in primary
          assert "authority-backed" not in primary.lower()
          assert "owner-authority" not in primary.lower()
          assert "How do we know?" in html
          assert "Technical details" in html
          assert "Repository languages" in html
          assert "SourcePawn" in html
          assert "PowerShell" in html
          assert "These percentages describe detected repository code volume" in html
          assert "details.open = !details.open;" in html
          assert "Contact the project owner" in html
          assert "Source commit:" in html
          PY
      - name: Collect technology-manifest evidence
        run: |
          python scripts/collect_public_evidence.py \
            https://github.com/armpitpete/over-my-home \
            --output /tmp/over-my-home-evidence.json
      - name: Interpret technology-manifest evidence
        run: |
          python scripts/interpret_evidence.py \
            /tmp/over-my-home-evidence.json \
            --output /tmp/over-my-home-interpretation.json
      - name: Validate evidence-linked technology candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(
              Path("/tmp/over-my-home-evidence.json").read_text(encoding="utf-8")
          )
          interpretation = json.loads(
              Path("/tmp/over-my-home-interpretation.json").read_text(
                  encoding="utf-8"
              )
          )
          assert evidence["repository"] == "armpitpete/over-my-home"
          files = {item["path"]: item for item in evidence["important_files"]}
          manifest = files["package.json"]
          assert manifest["role"] == "technology_manifest"
          assert manifest["source_commit"] == evidence["source_commit"]
          assert manifest["source_url"].endswith(
              f'{evidence["source_commit"]}/package.json'
          )

          technologies = {item["text"]: item for item in interpretation["technologies"]}
          javascript = technologies["This repository uses JavaScript or Node.js."]
          assert javascript["kind"] == "fact"
          assert javascript["evidence_keys"] == ["file:package.json"]
          references = {item["key"]: item for item in interpretation["evidence"]}
          assert references["file:package.json"]["role"] == "technology_manifest"
          assert references["file:package.json"]["usable"] is True
          PY
      - name: Run v0.7 live repository proofs
        run: |
          python scripts/live_repository_proofs.py \
            --output /tmp/project-reader-v0.7-live-proofs.json
      - name: Validate v0.7 live repository proof file
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/project-reader-v0.7-live-proofs.json").read_text(
                  encoding="utf-8"
              )
          )
          proofs = {item["repository"]: item for item in payload["proof_repositories"]}
          assert set(proofs) == {
              "armpitpete/project-status-engine",
              "armpitpete/over-my-home",
              "armpitpete/sample-hold-lab",
          }
          assert len(proofs["armpitpete/project-status-engine"]["language_names"]) >= 3
          assert proofs["armpitpete/project-status-engine"]["completion_percentage"] is not None
          assert proofs["armpitpete/over-my-home"]["status"] == "Unknown"
          assert proofs["armpitpete/over-my-home"]["completion_percentage"] is None
          assert all(item["html_contains_reader_questions"] for item in proofs.values())
          PY
