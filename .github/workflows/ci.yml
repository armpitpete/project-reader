name: Validate Project Reader

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python package
        run: python -m pip install -q -e ".[dev]"
      - name: Run Python tests
        run: pytest
      - name: Run deterministic browser comprehension contract
        run: node tests/browser_comprehension_contract.mjs
      - name: Run network-service and fallback contract
        run: node tests/network_and_fallback_contract.mjs
      - name: Rebuild static Python proofs
        run: |
          python scripts/render_sample.py
          python scripts/render_project_status_engine.py
          git diff --exit-code -- prototype/project-status-engine.html prototype/sample-reader.html
      - name: Build browser-only public artifact
        run: python scripts/build_pages_site.py --commit "$GITHUB_SHA" --output /tmp/project-reader-public
      - name: Verify browser-only safety boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/project-reader-public")
          files = sorted(path.name for path in root.iterdir())
          assert files == [
              ".nojekyll",
              "app.js",
              "comprehension.js",
              "deployment.json",
              "index.html",
              "network-corrections.js",
              "polish.js",
              "resilience.js",
          ]
          metadata = json.loads((root / "deployment.json").read_text(encoding="utf-8"))
          assert metadata["schema_version"] == 4
          assert metadata["runtime"] == "browser-only"
          assert metadata["public_data_origins"] == [
              "https://api.github.com",
              "https://raw.githubusercontent.com",
          ]
          assert metadata["rate_limit_fallback"] == "public README without account or token"
          assert metadata["public_files"] == files

          html = (root / "index.html").read_text(encoding="utf-8")
          app = (root / "app.js").read_text(encoding="utf-8")
          comprehension = (root / "comprehension.js").read_text(encoding="utf-8")
          network = (root / "network-corrections.js").read_text(encoding="utf-8")
          polish = (root / "polish.js").read_text(encoding="utf-8")
          resilience = (root / "resilience.js").read_text(encoding="utf-8")
          public = html + app + comprehension + network + polish + resilience
          assert "reader-api.merrinworld.uk" not in public
          assert "innerHTML" not in public
          assert "GITHUB_TOKEN" not in public
          assert 'method: "POST"' not in app
          assert 'method: "GET"' in app
          assert "javascript:" not in app.lower()
          assert "coding or markup language" not in comprehension
          assert "buildComprehension" in comprehension
          assert "polishReading" in app
          assert "correctNetworkServiceReading" in app
          assert "fetchRawReadme" in app
          assert "Command-line network client or service" in network
          assert "raw.githubusercontent.com" in resilience
          assert "Study or change the source code" in polish
          assert "Browse the course lessons" in polish
          assert "overflow-x:hidden" in html
          assert "script-src 'self'" in html
          assert "connect-src https://api.github.com https://raw.githubusercontent.com" in html
          PY

  live-public-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_READER_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install retained Python toolkit
        run: python -m pip install -q -e .
      - name: Run retained Python toolkit against public repositories
        run: |
          python scripts/live_repository_proofs.py \
            --output /tmp/project-reader-public-proofs.json
      - name: Verify live public proof file
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/project-reader-public-proofs.json").read_text(encoding="utf-8")
          )
          assert payload["schema_version"] == 2
          proofs = {item["repository"]: item for item in payload["proof_repositories"]}
          assert set(proofs) == {
              "armpitpete/over-my-home",
              "armpitpete/sample-hold-lab",
          }
          assert proofs["armpitpete/over-my-home"]["status"] == "Unknown"
          assert proofs["armpitpete/over-my-home"]["completion_percentage"] is None
          assert all(len(item["source_commit"]) == 40 for item in proofs.values())
          assert all(item["html_contains_reader_questions"] for item in proofs.values())
          PY

  live-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PROJECT_READER_ACCEPTANCE_OUTPUT: /tmp/project-reader-browser-acceptance.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read all three acceptance repositories
        run: node tests/live_browser_acceptance.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: project-reader-browser-acceptance
          path: /tmp/project-reader-browser-acceptance.json
          if-no-files-found: error

  browser-proof:
    needs:
      - test
      - live-browser-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build public artifact
        run: python scripts/build_pages_site.py --commit "$GITHUB_SHA" --output /tmp/project-reader-public
      - name: Capture normal and fallback desktop and narrow-width proofs
        run: bash tests/capture_browser_proofs.sh /tmp/project-reader-public /tmp/project-reader-browser-proofs
      - uses: actions/upload-artifact@v4
        with:
          name: project-reader-browser-proofs
          path: |
            /tmp/project-reader-browser-proofs/*.png
            /tmp/project-reader-browser-proofs/*.html
          if-no-files-found: error
