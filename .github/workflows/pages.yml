name: Deploy Project Reader Public Proof

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "prototype/public-reader.html"
      - "prototype/app.js"
      - "prototype/comprehension.js"
      - "prototype/network-corrections.js"
      - "prototype/polish.js"
      - "prototype/resilience.js"
      - "scripts/build_pages_site.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build public Pages artifact
        run: python scripts/build_pages_site.py --commit "$GITHUB_SHA" --output public
      - name: Verify public artifact boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("public")
          files = sorted(path.name for path in root.iterdir())
          assert files == [
              ".nojekyll",
              "app.js",
              "comprehension.js",
              "deployment.json",
              "index.html",
              "network-corrections.js",
              "polish.js",
              "resilience.js",
              "sitemap.xml",
          ]

          metadata = json.loads((root / "deployment.json").read_text(encoding="utf-8"))
          assert metadata["schema_version"] == 4
          assert metadata["deployed_commit"] == "${{ github.sha }}"
          assert metadata["runtime"] == "browser-only"
          assert metadata["public_data_origins"] == [
              "https://api.github.com",
              "https://raw.githubusercontent.com",
          ]
          assert metadata["rate_limit_fallback"] == "public README without account or token"
          assert metadata["public_files"] == files

          namespace = "http://www.sitemaps.org/schemas/sitemap/0.9"
          sitemap = ET.parse(root / "sitemap.xml").getroot()
          assert sitemap.tag == f"{{{namespace}}}urlset"
          locations = [
              element.text
              for element in sitemap.findall(f"{{{namespace}}}url/{{{namespace}}}loc")
          ]
          assert locations == ["https://armpitpete.github.io/project-reader/"]
          assert len(locations) == len(set(locations))

          html = (root / "index.html").read_text(encoding="utf-8")
          app = (root / "app.js").read_text(encoding="utf-8")
          comprehension = (root / "comprehension.js").read_text(encoding="utf-8")
          network = (root / "network-corrections.js").read_text(encoding="utf-8")
          polish = (root / "polish.js").read_text(encoding="utf-8")
          resilience = (root / "resilience.js").read_text(encoding="utf-8")
          public = html + app + comprehension + network + polish + resilience
          assert "Project Reader" in html
          assert "Understand what a public GitHub project is" in html
          assert "Read this project" in html
          assert "https://api.github.com" in app
          assert "https://raw.githubusercontent.com" in html
          assert "reader-api.merrinworld.uk" not in public
          assert "Project Reader deployment commit:" in html
          assert "${{ github.sha }}" in html
          assert "innerHTML" not in public
          assert "GITHUB_TOKEN" not in public
          assert "buildComprehension" in comprehension
          assert "polishReading" in app
          assert "correctNetworkServiceReading" in app
          assert "Command-line network client or service" in network
          assert "fetchRawReadme" in resilience
          assert "Study or change the source code" in polish
          assert "Browse the course lessons" in polish
          assert "overflow-x:hidden" in html
          blocked = ("I:\\", "C:\\", "SECRET", "PRIVATE KEY")
          assert not any(value in public.upper() for value in blocked)
          PY
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      issues: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact public deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import xml.etree.ElementTree as ET
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          base = os.environ["DEPLOYMENT_URL"].rstrip("/")
          expected = os.environ["EXPECTED_COMMIT"]
          metadata_url = f"{base}/deployment.json"
          sitemap_url = f"{base}/sitemap.xml"
          namespace = "http://www.sitemaps.org/schemas/sitemap/0.9"
          expected_locations = ["https://armpitpete.github.io/project-reader/"]
          last_error = "no response"

          for attempt in range(1, 31):
              metadata_request = Request(
                  f"{metadata_url}?verification={expected}-{attempt}",
                  headers={"Cache-Control": "no-cache", "Pragma": "no-cache"},
              )
              sitemap_request = Request(
                  f"{sitemap_url}?verification={expected}-{attempt}",
                  headers={"Cache-Control": "no-cache", "Pragma": "no-cache"},
              )
              try:
                  with urlopen(metadata_request, timeout=20) as response:
                      payload = json.load(response)
                  with urlopen(sitemap_request, timeout=20) as response:
                      sitemap_status = response.status
                      sitemap_content_type = response.headers.get_content_type()
                      sitemap_body = response.read()

                  sitemap = ET.fromstring(sitemap_body)
                  locations = [
                      element.text
                      for element in sitemap.findall(
                          f"{{{namespace}}}url/{{{namespace}}}loc"
                      )
                  ]
                  if (
                      payload.get("deployed_commit") == expected
                      and payload.get("schema_version") == 4
                      and payload.get("runtime") == "browser-only"
                      and payload.get("public_data_origins") == [
                          "https://api.github.com",
                          "https://raw.githubusercontent.com",
                      ]
                      and payload.get("rate_limit_fallback") == "public README without account or token"
                      and sitemap_status == 200
                      and sitemap_content_type in {"application/xml", "text/xml"}
                      and sitemap.tag == f"{{{namespace}}}urlset"
                      and locations == expected_locations
                      and len(locations) == len(set(locations))
                  ):
                      print(f"verified-url={metadata_url}")
                      print(f"verified-commit={expected}")
                      print(f"verified-sitemap={sitemap_url}")
                      print(f"verified-sitemap-content-type={sitemap_content_type}")
                      print(f"verified-sitemap-locations={locations!r}")
                      break
                  last_error = (
                      f"unexpected deployment state: metadata={payload!r}, "
                      f"sitemap_status={sitemap_status!r}, "
                      f"sitemap_content_type={sitemap_content_type!r}, "
                      f"sitemap_tag={sitemap.tag!r}, locations={locations!r}"
                  )
              except (
                  HTTPError,
                  URLError,
                  TimeoutError,
                  json.JSONDecodeError,
                  ET.ParseError,
              ) as error:
                  last_error = f"{type(error).__name__}: {error}"
              time.sleep(5)
          else:
              raise SystemExit(f"public deployment verification failed: {last_error}")
          PY
      - name: Record exact deployment evidence
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOYED_COMMIT: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > /tmp/project-reader-deployment.md <<EOF
          ## Project-scoped sitemap deployment verified

          GitHub Pages deployed and publicly returned the exact Project Reader release metadata and sitemap contract.

          - deployed commit: \`$DEPLOYED_COMMIT\`
          - public reader: $DEPLOYMENT_URL
          - verification file: ${DEPLOYMENT_URL%/}/deployment.json
          - sitemap: ${DEPLOYMENT_URL%/}/sitemap.xml
          - sitemap root: standard \`urlset\`
          - sitemap URL set: \`https://armpitpete.github.io/project-reader/\`
          - runtime: browser-only
          - public data origins: \`https://api.github.com\`, \`https://raw.githubusercontent.com\`
          - anonymous API fallback: public README without account or token
          - deployment run: $RUN_URL

          The deployment preserves the accepted Project Reader product boundary and adds only the project-scoped sitemap authorised by issue #41.
          EOF
          gh issue comment 41 --repo "$GITHUB_REPOSITORY" --body-file /tmp/project-reader-deployment.md
