name: Deploy Project Reader Public Proof

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "prototype/public-reader.html"
      - "prototype/project-status-engine.html"
      - "scripts/build_pages_site.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build public Pages artifact
        run: python scripts/build_pages_site.py --commit "$GITHUB_SHA" --output public
      - name: Verify public artifact boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("public")
          files = sorted(path.name for path in root.iterdir())
          assert files == [".nojekyll", "deployment.json", "index.html"]

          metadata = json.loads((root / "deployment.json").read_text(encoding="utf-8"))
          assert metadata["schema_version"] == 2
          assert metadata["deployed_commit"] == "${{ github.sha }}"
          assert metadata["runtime"] == "browser-only"
          assert metadata["public_data_origin"] == "https://api.github.com"
          assert metadata["public_files"] == files

          html = (root / "index.html").read_text(encoding="utf-8")
          assert "Project Reader" in html
          assert "Public GitHub repository" in html
          assert "Read this project" in html
          assert "https://api.github.com" in html
          assert "reader-api.merrinworld.uk" not in html
          assert "Project Reader deployment commit:" in html
          assert "${{ github.sha }}" in html
          assert "innerHTML" not in html
          assert "GITHUB_TOKEN" not in html
          blocked = ("I:\\", "C:\\", "SECRET", "PRIVATE KEY")
          assert not any(value in html.upper() for value in blocked)
          PY
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      issues: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact public deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          base = os.environ["DEPLOYMENT_URL"].rstrip("/")
          expected = os.environ["EXPECTED_COMMIT"]
          url = f"{base}/deployment.json"
          last_error = "no response"

          for attempt in range(1, 31):
              request = Request(
                  f"{url}?verification={expected}-{attempt}",
                  headers={"Cache-Control": "no-cache", "Pragma": "no-cache"},
              )
              try:
                  with urlopen(request, timeout=20) as response:
                      payload = json.load(response)
                  if (
                      payload.get("deployed_commit") == expected
                      and payload.get("runtime") == "browser-only"
                      and payload.get("public_data_origin") == "https://api.github.com"
                  ):
                      print(f"verified-url={url}")
                      print(f"verified-commit={expected}")
                      break
                  last_error = f"unexpected deployment metadata: {payload!r}"
              except (HTTPError, URLError, TimeoutError, json.JSONDecodeError) as error:
                  last_error = f"{type(error).__name__}: {error}"
              time.sleep(5)
          else:
              raise SystemExit(f"public deployment verification failed: {last_error}")
          PY
      - name: Record exact deployment evidence
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOYED_COMMIT: ${{ github.sha }}
        run: |
          cat > /tmp/project-reader-deployment.md <<EOF
          ## Public deployment verified

          GitHub Pages deployed and publicly returned the exact release metadata.

          - deployed commit: \`$DEPLOYED_COMMIT\`
          - public reader: $DEPLOYMENT_URL
          - verification file: ${DEPLOYMENT_URL%/}/deployment.json
          - runtime: browser-only
          - public data origin: \`https://api.github.com\`

          The Oracle VPS API is not part of the public runtime. This satisfies the final deployment and public-verification gates in issue #25.
          EOF
          gh issue comment 25 --repo "$GITHUB_REPOSITORY" --body-file /tmp/project-reader-deployment.md
