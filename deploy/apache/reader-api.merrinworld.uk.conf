<VirtualHost 10.0.0.107:80>
    ServerName reader-api.merrinworld.uk
    ServerAdmin webmaster@merrinworld.uk

    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost 10.0.0.107:443>
    ServerName reader-api.merrinworld.uk
    ServerAdmin webmaster@merrinworld.uk

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/reader-api.merrinworld.uk/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/reader-api.merrinworld.uk/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyAddHeaders On
    RequestHeader unset X-Forwarded-For early
    RequestHeader unset X-Forwarded-Host early
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "reader-api.merrinworld.uk"
    LimitRequestBody 4096

    ProxyPass / http://127.0.0.1:8091/ connectiontimeout=5 timeout=180
    ProxyPassReverse / http://127.0.0.1:8091/

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Frame-Options "DENY"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    ErrorLog ${APACHE_LOG_DIR}/reader-api.merrinworld.uk-error.log
    CustomLog ${APACHE_LOG_DIR}/reader-api.merrinworld.uk-access.log combined
</VirtualHost>
</IfModule>
