[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "project-reader"
version = "0.1.0"
description = "GitHub projects explained simply"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "gitingest==0.3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
